<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Clicker йопта</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="header">
            <h1 class="header_clicks">0</h1>
        </header>
        <main class="main">
            <div class="upgrades">
                <h3 class="click_info">Click power: 1</h3>
                <h3 class="auto_click_info">Auto click: disabled</h3>
            </div>
            <div class="action_button">
                <button>
                    <img class="click_button" src="clicker_button.png" alt="">
                </button>
            </div>
            <div class="shop">
                <h3 class="click_upgrade">Click upgrade: 30</h3>
                <h3 class="auto_click_upgrade">Auto clicks: 1000</h3>
            </div>
        </main>
        <footer class="footer">
            <p class="footer_info">Made by Puppok</p>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
