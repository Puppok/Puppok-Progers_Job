<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <title>ToDo App</title>
    </head>
    <body>
        <div class="wrapper">
            <main class="main">
                <div class="main_wrapper">
                    <h1 class="header">To Do List</h1>
                    <form action="#" class="form">
                        <input type="text" class="input">
                        <button class="add_btn">Add</button>
                    </form>
                    <h3 class="list_header">Task List</h3>
                    <section class="list"></section>
                    <hr width="80%" color="blue" size="3px">
                    <footer class="footer">
                        <p class="comleted">Completed: 0</p>
                        |
                        <p class="uncomleted">Uncompleted: 0</p>
                    </footer>
                </div>
            </main>
        </div>

        <script src="script.js"></script>
    </body>
</html>
