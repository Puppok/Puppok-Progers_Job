<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <title>Блог о путешествиях</title>
    </head>
    <body>
        <!-- === Шапка сайта === -->
        <header class="header">
            <div class="logo">TravelBlog</div> <!-- заголовок шапки -->
            <nav class="nav-menu"> <!-- меню навигации -->
                <a href="#">Главная</a>
                <a href="#">Страны</a>
                <a href="#">Советы</a>
                <a href="#">О нас</a>
            </nav>
        </header>

        <!-- === Главная часть === -->
        <main class="main-content"> <!-- Главный блок -->
            <section class="posts"> <!-- Блок с постами -->
                <h2>Последние статьи</h2> <!-- Заголовок блока -->

                <article class="post-card"> <!-- Карточка поста -->
                    <figure class="post-image"> <!-- Картинка поста -->
                        <img src="" alt=""> <!-- картинка -->
                        <figcaption></figcaption> <!-- аналог alt атрибута -->
                    </figure>
                    <div class="post-content"> <!-- Описание поста -->
                        <h3>Неделя в Париже</h3>
                        <p>Крутой отпуск в Париже, с улитками, лувром и эйфелевой башней</p>
                        <a href="">Читать далее...</a>
                    </div>
                </article>

            </section>
        </main>

    </body>
</html>
